name: Weekly release

on:
  schedule:
    - cron: "0 12 * * 5" # run at 12:00 UTC on Fridays
  workflow_dispatch:

concurrency:
  group: weekly-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest

    steps:
      - name: Draft and publish release
        id: release
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          publish: true
      - name: Trigger publishing workflow
        run: gh workflow run python-publish.yml --ref "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
