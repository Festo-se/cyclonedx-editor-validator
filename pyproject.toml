[project]
name = "cyclonedx-editor-validator"
version = "0.0.0"
description = "Tool for creating, modifying and validating CycloneDX SBOMs."
authors = [
    { name = "Aleg Vilinski", email = "aleg.vilinski@festo.com" },
    { name = "Christian Beck", email = "christian.beck@festo.com" },
    { name = "Moritz Marseu", email = "moritz.marseu@festo.com" },
]
requires-python = ">=3.11.0,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "python-dateutil==2.9.0.post0",
    "jsonschema-rs==0.56.0",
    "docstring-parser>=0.16,<0.19",
    "charset-normalizer>=3.3.2,<4",
    "pyicu>=2.13.1,<3 ; sys_platform == 'darwin'",
    "pyicu>=2.13.1,<3 ; sys_platform == 'linux'",
    "natsort>=8.4.0,<9",
    "univers==32.0.1",
    "cyclonedx-python-lib==11.12.0",
    "email-validator==2.3.0",
    "license-expression==30.4.4",
]

[project.urls]
Documentation = "https://festo-se.github.io/cyclonedx-editor-validator/"
Repository = "https://github.com/Festo-se/cyclonedx-editor-validator/"
Issues = "https://github.com/Festo-se/cyclonedx-editor-validator/issues"
Changelog = "https://github.com/Festo-se/cyclonedx-editor-validator/releases"

[project.scripts]
cdx-ev = "cdxev.__main__:main"

[dependency-groups]
dev = [
    "ty==0.0.82",
    "types-python-dateutil==2.9.0.20260807",
    "pytest==9.1.1",
    "coverage==7.16.0",
    "toml==0.10.2",
    "typing-extensions==4.16.0",
    "pre-commit==4.6.2",
    "ruff==0.16.7",
]
docs = [
    "sphinx-argparse==0.6.1",
    "sphinx-rtd-theme==3.1.0",
    "sphinx==9.0.4",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]
required-version = ">=0.7.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdxev"]

[tool.ty.environment]
python-version = "3.11"
root = ["./cdxev"]

[tool.ty.src]
exclude = ["**/tests/**"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[[tool.ty.overrides]]
include = [
    "cdxev/initialize_sbom.py",
    "cdxev/list_command.py",
    "cdxev/auxiliary/sbom_functions.py",
]

[tool.ty.overrides.rules]
invalid-type-form = "ignore"
too-many-positional-arguments = "ignore"
unknown-argument = "ignore"

[[tool.ty.overrides]]
include = [
    "cdxev/merge.py",
    "cdxev/set.py",
    "cdxev/amend/operations.py",
    "cdxev/amend/license.py",
    "cdxev/amend/command.py",
    "cdxev/__main__.py",
    "cdxev/validator/helper.py",
    "cdxev/validator/validate.py",
    "cdxev/auxiliary/io_processing.py",
    "cdxev/auxiliary/sbom_functions.py",
    "cdxev/auxiliary/filename_gen.py",
    "cdxev/auxiliary/identity.py",
    "cdxev/validator/customreports.py",
    "cdxev/build_public_bom.py",
]

[tool.ty.overrides.rules]
missing-type-argument = "ignore"

[[tool.ty.overrides]]
include = ["cdxev/__main__.py"]

[tool.ty.overrides.rules]
unsound-return-statement = "ignore"

[tool.coverage.run]
source = ["cdxev"]

[tool.coverage.report]
omit = ["*__init__.py*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 99
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and pycodestyle (`E`) codes by default.
# Additionally adds isort (`I`), pep8-naming (`N`), bandit (`S`), and enables
# pycodestyle warnings (`W`), McCabe complexity (`C901`) and flake8-bugbear (`B`).
# Also adds flake8-annotations (`ANN`), flake8-pyi (`PYI`) and pygrep-hooks (`PGH003`)
# according to https://docs.astral.sh/ty/coming-from-mypy-or-pyright
select = ["E", "F", "I", "N", "W", "C901", "S", "B", "PIE", "ANN", "PYI", "PGH003"]
ignore = ["E203", "E722"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[too.ruff.lint.pycodestyle]
max-line-length=99

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "ANN001", "ANN201", "ANN202", "ANN206"]
# Atheris fuzz harnesses require the entry point to be named `TestOneInput`.
"**/tests/fuzz/*" = ["S101", "N802"]
"tests/auxiliary/helper.py" = ["ANN401"]
"cdxev/__main__.py" = ["ANN401"]
"cdxev/auxiliary/sbom_functions.py" = ["ANN401"]
"cdxev/merge.py" = ["ANN401"]
"cdxev/set.py" = ["ANN401"]
"cdxev/validator/helper.py" = ["ANN401"]
